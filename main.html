<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>

    <link rel="shortcut icon" type="image" href="assets/github-logo.png" />
    <title>Github Issue Tracker</title>
  </head>

  <body class="min-h-screen bg-base-200">
    <header>
      <div
        class="navbar justify-between bg-base-100 shadow-sm px-4 flex-col gap-3 sm:flex-row sm:gap-0"
      >
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <div class="avatar">
            <div class="w-10 rounded-full bg-white p-1">
              <img src="assets/github-logo.png" alt="GitHub logo" />
            </div>
          </div>

          <h1 class="text-lg sm:text-xl font-bold py-2">
            GitHub Issues Tracker
          </h1>
        </div>

        <div
          class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto sm:items-center sm:justify-end"
        >
          <label
            class="input input-bordered flex items-center gap-2 w-full sm:w-80"
          >
            <i class="fa-solid fa-magnifying-glass text-base-content/60"></i>
            <input
              id="searchInput"
              type="text"
              class="grow"
              placeholder="Search issues..."
            />
          </label>

          <button id="newIssueBtn" class="btn btn-primary w-full sm:w-auto">
            <i class="fa-solid fa-plus"></i>
            New Issue
          </button>
        </div>
      </div>
    </header>
    <main>
      <section class="p-4">
        <div class="max-w-5xl mx-auto">
          <div class="bg-base-100 shadow-sm rounded-xl p-6">
            <div class="join w-full gap-2 sm:w-auto">
              <button
                id="filterAll"
                class="btn join-item btn-primary sm:w-auto"
              >
                All
              </button>
              <button
                id="filterOpen"
                class="btn join-item btn-outline sm:w-auto"
              >
                Open
              </button>
              <button
                id="filterClosed"
                class="btn join-item btn-outline sm:w-auto"
              >
                Closed
              </button>
            </div>
          </div>
        </div>
      </section>
      <section class="p-4">
        <div class="max-w-5xl mx-auto">
          <div class="bg-base-100 shadow-sm rounded-xl">
            <div
              class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 p-5"
            >
              <div class="flex items-center gap-2">
                <div class="avatar">
                  <div
                    class="w-12 rounded-full bg-primary/10 flex items-center justify-center"
                  >
                    <img
                      src="assets/Aperture.png"
                      alt="Aperture icon"
                      class="w-6 h-6 object-contain"
                    />
                  </div>
                </div>

                <div>
                  <h2 class="text-lg sm:text-xl font-bold">
                    <span id="issuesCount">50</span> Issues
                  </h2>
                  <p class="text-sm text-base-content/60">
                    Track and manage your project issues
                  </p>
                </div>
              </div>

              <div class="flex flex-wrap gap-x-6 gap-y-2 sm:justify-end">
                <div class="flex items-center gap-2">
                  <span
                    class="w-3 h-3 rounded-full bg-[#068606] inline-block"
                  ></span>
                  <span class="font-semibold">Open</span>
                </div>

                <div class="flex items-center gap-2">
                  <span
                    class="w-3 h-3 rounded-full bg-[#8e06ce] inline-block"
                  ></span>
                  <span class="font-semibold">Closed</span>
                </div>
              </div>
            </div>

            <div class="border-t border-base-300"></div>
          </div>
        </div>
      </section>

      <section class="p-4">
        <div class="max-w-5xl mx-auto">
          <div
            id="cardsContainer"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"
          ></div>
        </div>
      </section>
    </main>
    <dialog id="issueModal" class="modal">
      <div class="modal-box max-w-3xl">
        <h3 id="modalTitle" class="text-2xl font-bold">Issue Title</h3>

        <div class="flex flex-wrap items-center gap-3 mt-3 text-sm">
          <span id="modalStatusBadge" class="badge badge-success">Open</span>
          <span class="text-base-content/60">•</span>
          <span class="text-base-content/70">
            Opened by <span id="modalAuthor" class="font-semibold">Author</span>
          </span>
          <span class="text-base-content/60">•</span>
          <span id="modalCreatedAt" class="text-base-content/70">Date</span>
        </div>

        <div id="modalLabels" class="flex flex-wrap gap-2 mt-4"></div>

        <p
          id="modalDescription"
          class="mt-4 text-base-content/70 leading-relaxed"
        >
          Description
        </p>

        <div class="bg-base-200 rounded-xl p-4 mt-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <p class="text-sm text-base-content/60">Assignee:</p>
              <p id="modalAssignee" class="font-bold">None</p>
            </div>

            <div>
              <p class="text-sm text-base-content/60">Priority:</p>
              <span id="modalPriorityBadge" class="badge badge-error"
                >HIGH</span
              >
            </div>
          </div>
        </div>

        <div class="modal-action">
          <form method="dialog">
            <button class="btn btn-primary">Close</button>
          </form>
        </div>
      </div>

      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>
    <script src="modal.js"></script>
    <script src="cards.js"></script>
  </body>
</html>
