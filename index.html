<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>

    <link rel="shortcut icon" type="image" href="assets/github-logo.png" />
    <title>Github Issue Tracker</title>
  </head>

  <body class="min-h-screen bg-base-200">
    <main class="min-h-screen flex items-center justify-center p-4">
      <section class="w-full max-w-md">
        <div class="card bg-base-100 shadow-xl">
          <div class="card-body gap-5">
            <div class="flex flex-col items-center text-center gap-3">
              <div>
                <div class="w-30 rounded-full bg-white p-4">
                  <img
                    src="assets/github-logo.png"
                    alt="GitHub logo"
                    class="w-full h-full object-contain"
                  />
                </div>
              </div>

              <div class="space-y-1">
                <h1 class="text-2xl font-bold text-base-content">
                  GitHub Issues Tracker
                </h1>
                <p class="text-sm">Sign in to manage your issues</p>
              </div>
            </div>
            <form id="loginForm" class="space-y-4">
              <div>
                <label class="label" for="username">
                  <span class="label-text font-bold">Username</span>
                </label>

                <input
                  id="username"
                  name="username"
                  type="text"
                  placeholder="Enter Username"
                  class="input input-bordered w-full"
                />
              </div>

              <div>
                <label class="label" for="password">
                  <span class="label-text font-bold">Password</span>
                </label>

                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter Password"
                  class="input input-bordered w-full"
                />
              </div>

              <button
                type="submit"
                class="btn btn-primary btn-block font-semibold"
              >
                Sign In
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
